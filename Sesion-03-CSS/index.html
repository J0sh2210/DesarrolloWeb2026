<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Galería de Productos</h1>

        <!-- TODO: Galería de productos
             Cada tarjeta debe contener:
             - Imagen del producto (usa placeholder o imágenes de ejemplo)
             - Nombre del producto
             - Precio
             - Botón con texto "Comprar"
             
             Desktop (>=1024px): 3 columnas
             Mobile (<768px): 1 columna con scroll vertical
        -->
        <section class="galeria">

            <article class="producto">
                <img src="./img/cocacola.png" alt="Producto 1" >
                <div class="producto-info">
                    <h2>Coca cola en lata</h2>
                    <p class="precio">Q5.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="./img/cocazero.jpg" alt="Producto 2" >
                <div class="producto-info">
                    <h2>Coca cola Zero</h2>
                    <p class="precio">Q4.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="./img/comidagato.jpg" alt="Producto 3" >
                <div class="producto-info">
                    <h2>Comida para gato</h2>
                    <p class="precio">Q10.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="./img/lechecondensada.webp" alt="Producto 4">
                <div class="producto-info">
                    <h2>Leche condensada</h2>
                    <p class="precio">Q9.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="./img/maiz.webp" alt="Producto 5">
                <div class="producto-info">
                    <h2>Lata de maiz dulce</h2>
                    <p class="precio">Q6.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="./img/OIP.webp" alt="Producto 6">
                <div class="producto-info">
                    <h2>Lata de frijoles</h2>
                    <p class="precio">Q5.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>To-Do List</h2>

        <!-- TODO: Layout de Todo List
             Lista de tareas estilizada con:
             - Checkbox para marcar completado
             - Texto de la tarea
             - Diseño limpio y accesible
        -->
        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
