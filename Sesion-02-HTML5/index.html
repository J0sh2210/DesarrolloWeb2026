<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persly</title>
  <meta name="description" content="Sitio de prueba para tarea 2" >
  <meta name="author" content="JRmz" >
  <link rel="icon" type="image/png" href="images/logo.jpg" >
  <!-- TODO: agrega meta description, autor, favicon -->
</head>
<body>

  <!-- TODO: header con navegacion a las otras 3 paginas -->
  <header>
    <h1>Persly</h1>
    <!-- TODO: <nav> con enlaces a pagina1.html, pagina2.html, pagina3.html -->
      <nav>
        <ul>
          <li><a href="pagina1.html">Ir a Planes</a></li>
          <li><a href="pagina2.html">Ir a Precios</a></li>
          <li><a href="pagina3.html">Ir a Quienes somos</a></li>
        </ul>
      </nav>
  </header>

  <main>
    <article>
      <h2>Bienvenido</h2>

      <!-- TODO: usa <figure> + <figcaption> para una imagen con alt y loading="lazy" -->
      <img src="https://clipground.com/images/bienvenidos-png-10.png"
           alt="Imagen de bienvenida"
           width="800" height="400"
           loading="lazy">

      <p>Persly</p>

      <!-- TODO: usa <dialog> + un boton con command/commandfor (Invoker Commands API) -->
      <dialog id="bienvenida">
        <h3>Descubre algo especial</h3>
        <p>Persly esta de oferta, si contratas en los proximos dias te daremos un descuento del 10%, aprovecha!!</p>
        <form method="dialog">
          <button>Cerrar</button>
        </form>
      </dialog>
      <button command="show-modal" commandfor="bienvenida">
        Descubrir
      </button>

      <!-- TODO: usa popover para un menu o tooltip -->
      <button popovertarget="menu-ayuda">?</button>
      <div id="menu-ayuda" popover>
        <h4>Ayuda</h4>
        <p>En desarrollo</p>
      </div>

      <!-- TODO: formulario con al menos 3 inputs (text, email, etc.) -->
      <form action="#" method="POST">
        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" name="nombre" required minlength="3">

        <label for="email">Email:</label>
        <input id="email" type="email" name="email" required>

        <label for="mensaje">en que necesitas ayuda:</label>
        <textarea id="mensaje" name="mensaje" rows="4"></textarea>

        <button type="submit">Enviar</button>
      </form>
    </article>

    <!-- TODO: usa <aside> para contenido lateral -->
      <aside  >
        <h3>menu lateral</h3>
      </aside>
     
      
  </main>

  <footer>
    <p>&copy; 2026 Persly — Universidad Mariano Galvez</p>
  </footer>

</body>
</html>
